<!DOCTYPE html>
<html>
<head>
    <title>Day 04: Clusters - Philippine Olympic Medalists</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet & MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <style>
        body { padding: 0; margin: 0; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Leaflet & MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script>
        // Initialize map centered on the Philippines
        var map = L.map('map').setView([12.8797, 121.7740], 6);

        // Add a clean CARTO basemap
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Initialize the cluster group
        var markers = L.markerClusterGroup();

        // Load the GeoJSON file you generated
        fetch('medalists.geojson')
            .then(response => response.json())
            .then(data => {
                var geoJsonLayer = L.geoJSON(data, {
                    onEachFeature: function (feature, layer) {
                        var popupContent = "<b>" + feature.properties.Name + "</b><br/>" +
                                           "Sport: " + feature.properties.Sport + "<br/>" +
                                           "Region: " + feature.properties.Region;
                        layer.bindPopup(popupContent);
                    }
                });
                
                // Add the points to the cluster group, then add the cluster group to the map
                markers.addLayer(geoJsonLayer);
                map.addLayer(markers);
            })
            .catch(error => console.error('Error loading GeoJSON:', error));
    </script>
</body>
</html>
